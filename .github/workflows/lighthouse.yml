name: Lighthouse

# 수동 실행만 한다. 이 사이트는 성능·SEO에 영향 없는 변경(약관 문안 등)이 대부분이라
# 배포마다 재면 잡음이 된다. 이전·폰트·이미지처럼 비교가 필요한 시점에 버튼으로 돌린다.
# 프로덕션이 기본이다 — Vercel 프리뷰는 배포 보호로 302를 반환해 로그인 페이지를 재게 된다.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "측정할 주소 (비우면 프로덕션)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 측정
        env:
          LHCI_BASE_URL: ${{ inputs.url || 'https://www.syncrunlabs.com' }}
        run: npm run lighthouse

      # 요약 스크립트가 리다이렉트를 감지하면 0이 아닌 코드로 끝난다 — 엉뚱한 사이트를 잰 결과를
      # 성공으로 남기지 않는다.
      - name: 표 만들기
        run: |
          {
            echo "## Lighthouse"
            echo
            node scripts/lighthouse-summary.mjs
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
          include-hidden-files: true
